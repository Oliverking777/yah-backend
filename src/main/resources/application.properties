spring.application.name=yah-enterprise

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------
# PostgreSQL datasource
# Override with environment variables in real environments:
#   DB_USERNAME, DB_PASSWORD
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/yah_enterprise
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:newpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate only checks that the tables match the entities.
# The tables are created by the Flyway migrations (db/migration).
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# Flyway (runs automatically at startup, before Hibernate validates)
# Migrations live in: src/main/resources/db/migration
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# OpenAPI / Swagger UI (springdoc)
#   UI:   http://localhost:8080/swagger-ui.html
#   JSON: http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------
# Security (sessions, cookie, CORS)
# ---------------------------------------------------------------
# Browser origins allowed to call the API (your dashboard). Comma-separated for several.
app.security.allowed-origins=http://localhost:3000,http://localhost:5173
# Header required on state-changing requests that are authenticated by cookie (CSRF protection)
app.security.csrf-header=X-Requested-With
# Session cookie used by web clients
app.security.cookie.name=YAH_SESSION
# MUST be true in production (HTTPS). false only so it works on http://localhost
app.security.cookie.secure=false
app.security.cookie.same-site=Lax

# ---------------------------------------------------------------
# Actuator: only the health endpoint is reachable
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
# No Elasticsearch is running, so its health check is switched off
management.health.elasticsearch.enabled=false

# ---------------------------------------------------------------
# Bootstrap: creates the FIRST admin and owner users, only when there are NO users yet.
# The ADMIN and OWNER roles and all permissions come from the Flyway migration V10.
# A user is only created if its password is set. Without any password no user is created
# (a warning is logged) and nobody can log in.
# Set the passwords as environment variables, never in this file, e.g.:
#   export BOOTSTRAP_ADMIN_PASSWORD='...'
#   export BOOTSTRAP_OWNER_PASSWORD='...'
# Passwords: 8 to 72 characters, at least one letter and one digit.
# After the first start and your first login, change the passwords and remove the
# BOOTSTRAP_*_PASSWORD variables from the environment.
# ---------------------------------------------------------------
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap.owner.password=${BOOTSTRAP_OWNER_PASSWORD:owner123}
app.bootstrap.owner.first-name=${BOOTSTRAP_OWNER_FIRST_NAME:Business}
app.bootstrap.owner.last-name=${BOOTSTRAP_OWNER_LAST_NAME:Owner}