spring.application.name=yah-enterprise

# ---------------------------------------------------------------
# Server
# Render injects PORT. Locally it falls back to 8080.
# forward-headers-strategy: Render terminates HTTPS at its proxy,
# this makes Spring honour X-Forwarded-* headers (correct scheme/host).
# ---------------------------------------------------------------
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# PostgreSQL datasource (Neon)
# Set DB_URL to the JDBC url of your Neon DIRECT connection (host WITHOUT "-pooler"):
#   jdbc:postgresql://ep-xxxx.<region>.aws.neon.tech/<dbname>?sslmode=require
# Do not put user/password in the url: use DB_USERNAME and DB_PASSWORD.
# Locally you can instead use DB_HOST / DB_PORT / DB_NAME (+ DB_SSLMODE).
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yah_enterprise}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuned for Neon: small pool (free-tier connection limits),
# generous timeout (a suspended Neon database needs a few seconds to wake up),
# connections recycled before Neon/idle timeouts can silently drop them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# ---------------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate only checks that the tables match the entities.
# The tables are created by the Flyway migrations (db/migration).
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# Flyway (runs automatically at startup, before Hibernate validates)
# Migrations live in: src/main/resources/db/migration
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# OpenAPI / Swagger UI (springdoc)
# Set SWAGGER_ENABLED=false in production to hide it.
# ---------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------
# Security (sessions, cookie, CORS)
# ALLOWED_ORIGINS: your dashboard URL(s), comma-separated, no trailing slash.
# COOKIE_SECURE must be true in production (HTTPS).
# COOKIE_SAME_SITE: Lax if frontend and API share the same site,
#                   None (with COOKIE_SECURE=true) if they are on different sites.
# ---------------------------------------------------------------
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.security.csrf-header=X-Requested-With
app.security.cookie.name=YAH_SESSION
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------
# Actuator: only the health endpoint is reachable
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------
# Bootstrap: creates the FIRST admin and owner users, only when there are NO users yet.
# No default passwords: if the variables are not set, no user is created.
# Set BOOTSTRAP_ADMIN_PASSWORD and BOOTSTRAP_OWNER_PASSWORD as environment variables.
# Passwords: 8 to 72 characters, at least one letter and one digit.
# After your first login, change the passwords and remove the variables.
# ---------------------------------------------------------------
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap.owner.password=${BOOTSTRAP_OWNER_PASSWORD:}
app.bootstrap.owner.first-name=${BOOTSTRAP_OWNER_FIRST_NAME:Business}
app.bootstrap.owner.last-name=${BOOTSTRAP_OWNER_LAST_NAME:Owner}